<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>dsh-comfyui-canvas 流程图</title>
<style>
  body { margin: 0; background: #0f1115; color: #e6e9ef; font-family: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
</style>
</head>
<body>
<svg width="1240" height="980" viewBox="0 0 1240 980" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4f9cf9"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3fb27f"/></marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d9a13b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>

  <!-- 标题 -->
  <text x="40" y="42" font-size="24" font-weight="700" fill="#e6e9ef">dsh-comfyui-canvas — 一次画布操作的生命周期（泳道流程图）</text>
  <text x="40" y="68" font-size="14" fill="#9aa3b2">以「改 seed 并运行」为例：谁在哪个环节干什么、数据怎么走、结果怎么回来。</text>

  <!-- 泳道背景：四行 -->
  <g>
    <rect x="30"  y="90"  width="200" height="860" rx="10" fill="#141823"/>
    <rect x="250" y="90"  width="330" height="860" rx="10" fill="#151a26"/>
    <rect x="600" y="90"  width="300" height="860" rx="10" fill="#14221c"/>
    <rect x="920" y="90"  width="290" height="860" rx="10" fill="#1a1d27"/>
  </g>

  <!-- 泳道标题 -->
  <g font-size="15" font-weight="700">
    <text x="130" y="120" fill="#4f9cf9" text-anchor="middle">用户 / 浏览器</text>
    <text x="415" y="120" fill="#4f9cf9" text-anchor="middle">DSH Host · agent + 插件</text>
    <text x="750" y="120" fill="#3fb27f" text-anchor="middle">ComfyUI 服务</text>
    <text x="1065" y="120" fill="#9b7ce8" text-anchor="middle">ComfyUI 前端</text>
  </g>
  <g font-size="11" fill="#5b6residual778">
    <text x="130" y="142" fill="#5b6778" text-anchor="middle">DSH Web · ComfyUI 标签</text>
    <text x="415" y="142" fill="#5b6778" text-anchor="middle">lib/index.js · 12 工具</text>
    <text x="750" y="142" fill="#5b6778" text-anchor="middle">__init__.py 桥接后端</text>
    <text x="1065" y="142" fill="#5b6778" text-anchor="middle">bridge.js · LiteGraph</text>
  </g>

  <!-- ============ 步骤 1：用户发言 ============ -->
  <g filter="url(#shadow)">
    <rect x="45" y="170" width="170" height="64" rx="9" fill="#1c2230" stroke="#4f9cf9"/>
    <text x="130" y="196" font-size="13.5" fill="#e6e9ef" text-anchor="middle" font-weight="600">① 用户对话</text>
    <text x="130" y="216" font-size="11.5" fill="#9aa3b2" text-anchor="middle">「把 seed 改成 42 然后跑」</text>
  </g>
  <line x1="215" y1="202" x2="286" y2="202" stroke="#4f9cf9" stroke-width="2" marker-end="url(#arr)"/>

  <g filter="url(#shadow)">
    <rect x="292" y="170" width="250" height="64" rx="9" fill="#1c2230" stroke="#4f9cf9"/>
    <text x="417" y="196" font-size="13.5" fill="#e6e9ef" text-anchor="middle" font-weight="600">② agent 解析意图</text>
    <text x="417" y="216" font-size="11.5" fill="#9aa3b2" text-anchor="middle">调 comfyui_set_param → 再 run</text>
  </g>

  <!-- ============ 步骤 3：host → 桥接 command ============ -->
  <line x1="417" y1="234" x2="417" y2="284" stroke="#4f9cf9" stroke-width="2" marker-end="url(#arr)"/>
  <g filter="url(#shadow)">
    <rect x="292" y="290" width="250" height="64" rx="9" fill="#1c2230" stroke="#d9a13b"/>
    <text x="417" y="316" font-size="13.5" fill="#e6e9ef" text-anchor="middle" font-weight="600">③ host 发写命令</text>
    <text x="417" y="336" font-size="11.5" fill="#9aa3b2" text-anchor="middle">POST /dsh-bridge/command</text>
  </g>
  <line x1="542" y1="322" x2="612" y2="322" stroke="#3fb27f" stroke-width="2" marker-end="url(#arrG)"/>

  <g filter="url(#shadow)">
    <rect x="618" y="290" width="264" height="64" rx="9" fill="#172823" stroke="#3fb27f"/>
    <text x="750" y="316" font-size="13.5" fill="#e6e9ef" text-anchor="middle" font-weight="600">④ 桥接后端接收</text>
    <text x="750" y="336" font-size="11.5" fill="#9aa3b2" text-anchor="middle">clientId 定向 · 可选 token</text>
  </g>
  <line x1="882" y1="322" x2="952" y2="322" stroke="#3fb27f" stroke-width="2" marker-end="url(#arrG)"/>

  <g filter="url(#shadow)">
    <rect x="958" y="290" width="214" height="64" rx="9" fill="#1f2230" stroke="#9b7ce8"/>
    <text x="1065" y="316" font-size="13.5" fill="#e6e9ef" text-anchor="middle" font-weight="600">⑤ 前端执行</text>
    <text x="1065" y="336" font-size="11.5" fill="#9aa3b2" text-anchor="middle">LiteGraph 画布实时变化</text>
  </g>

  <!-- ============ 步骤 6：结果回传 ============ -->
  <text x="1065" y="392" font-size="24" fill="#3fb27f" text-anchor="middle">↓</text>
  <g filter="url(#shadow)">
    <rect x="958" y="406" width="214" height="52" rx="9" fill="#172823" stroke="#3fb27f"/>
    <text x="1065" y="428" font-size="13.5" fill="#e6e9ef" text-anchor="middle" font-weight="600">⑥ 上报执行结果</text>
    <text x="1065" y="446" font-size="11" fill="#9aa3b2" text-anchor="middle">POST /dsh-bridge/result</text>
  </g>
  <line x1="958" y1="416" x2="900" y2="416" stroke="#3fb27f" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="900" y1="432" x2="886" y2="432" stroke="#3fb27f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="908" y="410" font-size="10.5" fill="#3fb27f">轮询</text>

  <g filter="url(#shadow)">
    <rect x="618" y="406" width="264" height="52" rx="9" fill="#172823" stroke="#3fb27f"/>
    <text x="750" y="428" font-size="13.5" fill="#e6e9ef" text-anchor="middle" font-weight="600">⑦ 桥接记结果</text>
    <text x="750" y="446" font-size="11" fill="#9aa3b2" text-anchor="middle">_command_results 暂存</text>
  </g>
  <line x1="618" y1="420" x2="556" y2="420" stroke="#3fb27f" stroke-width="2" marker-end="url(#arrG)"/>

  <g filter="url(#shadow)">
    <rect x="292" y="406" width="250" height="52" rx="9" fill="#1c2230" stroke="#d9a13b"/>
    <text x="417" y="428" font-size="13.5" fill="#e6e9ef" text-anchor="middle" font-weight="600">⑧ host 读到结果</text>
    <text x="417" y="446" font-size="11" fill="#9aa3b2" text-anchor="middle">agent 确认 set_param 成功</text>
  </g>

  <!-- ============ 分割：第二阶段 运行 ============ -->
  <line x1="30" y1="490" x2="1210" y2="490" stroke="#2a3040" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="46" y="514" font-size="13.5" fill="#d9a13b" font-weight="600">第二阶段 · 运行与取图：</text>

  <g filter="url(#shadow)">
    <rect x="292" y="536" width="250" height="58" rx="9" fill="#1c2230" stroke="#d9a13b"/>
    <text x="417" y="560" font-size="13" fill="#e6e9ef" text-anchor="middle" font-weight="600">⑨ comfyui_run</text>
    <text x="417" y="580" font-size="11" fill="#9aa3b2" text-anchor="middle">command → queuePrompt 入队</text>
  </g>
  <line x1="542" y1="565" x2="612" y2="565" stroke="#3fb27f" stroke-width="2" marker-end="url(#arrG)"/>

  <g filter="url(#shadow)">
    <rect x="618" y="536" width="264" height="58" rx="9" fill="#172823" stroke="#3fb27f"/>
    <text x="750" y="560" font-size="13" fill="#e6e9ef" text-anchor="middle" font-weight="600">⑩ POST /prompt·执行</text>
    <text x="750" y="580" font-size="11" fill="#9aa3b2" text-anchor="middle">SaveImage→output/ · Preview→temp/</text>
  </g>

  <!-- ============ 步骤 11-13：取图 ============ -->
  <line x1="417" y1="594" x2="417" y2="644" stroke="#4f9cf9" stroke-width="2" marker-end="url(#arr)"/>
  <text x="300" y="700" font-size="11" fill="#9aa3b2">||</text>
  <g filter="url(#shadow)">
    <rect x="292" y="662" width="250" height="58" rx="9" fill="#1c2230" stroke="#4f9cf9"/>
    <text x="417" y="686" font-size="13" fill="#e6e9ef" text-anchor="middle" font-weight="600">⑪ comfyui_get_outputs</text>
    <text x="417" y="706" font-size="11" fill="#9aa3b2" text-anchor="middle">读 /history/:id + /view</text>
  </g>
  <line x1="542" y1="691" x2="612" y2="691" stroke="#3fb27f" stroke-width="2" marker-end="url(#arrG)"/>

  <g filter="url(#shadow)">
    <rect x="618" y="662" width="264" height="58" rx="9" fill="#172823" stroke="#3fb27f"/>
    <text x="750" y="686" font-size="13" fill="#e6e9ef" text-anchor="middle" font-weight="600">⑫ 返回图片清单/URL</text>
    <text x="750" y="706" font-size="11" fill="#9aa3b2" text-anchor="middle">filename · type · subfolder</text>
  </g>
  <line x1="618" y1="676" x2="556" y2="676" stroke="#3fb27f" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="556" y1="691" x2="542" y2="691" stroke="#3fb27f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="380" y="676" font-size="10.5" fill="#3fb27f">下载/取回</text>

  <g filter="url(#shadow)">
    <rect x="45" y="640" width="170" height="70" rx="9" fill="#1c2230" stroke="#4f9cf9"/>
    <text x="130" y="664" font-size="13" fill="#e6e9ef" text-anchor="middle" font-weight="600">⑬ 对话展示出图</text>
    <text x="130" y="684" font-size="11" fill="#9aa3b2" text-anchor="middle">图片直接带回 chat / 本地目录</text>
  </g>
  <line x1="292" y1="696" x2="218" y2="692" stroke="#4f9cf9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ 批量 / 环境 / MCP 段 ============ -->
  <line x1="30" y1="766" x2="1210" y2="766" stroke="#2a3040" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="46" y="792" font-size="13.5" fill="#9aa3b2" font-weight="600">批量 / 环境 / 可选 MCP：</text>

  <g font-size="12">
    <text x="130" y="830" text-anchor="middle" fill="#9aa3b2">agent 指令</text>
    <text x="130" y="850" text-anchor="middle" fill="#5b6778" font-size="11">「跑 4 组 seed」</text>
  </g>
  <line x1="215" y1="840" x2="286" y2="840" stroke="#4f9cf9" stroke-width="1.5" marker-end="url(#arr)"/>
  <g filter="url(#shadow)">
    <rect x="292" y="812" width="250" height="52" rx="9" fill="#1c2230" stroke="#d9a13b"/>
    <text x="417" y="834" font-size="13" fill="#e6e9ef" text-anchor="middle" font-weight="600">comfyui_batch_run</text>
    <text x="417" y="852" font-size="11" fill="#9aa3b2" text-anchor="middle">参数矩阵逐组 queuePrompt（串行）</text>
  </g>
  <line x1="542" y1="838" x2="612" y2="838" stroke="#3fb27f" stroke-width="1.5" marker-end="url(#arrG)"/>
  <g filter="url(#shadow)">
    <rect x="618" y="812" width="264" height="52" rx="9" fill="#172823" stroke="#3fb27f"/>
    <text x="750" y="834" font-size="13" fill="#e6e9ef" text-anchor="middle" font-weight="600">逐组入队 · 一并取图</text>
    <text x="750" y="852" font-size="11" fill="#9aa3b2" text-anchor="middle">get_outputs 逐个 prompt_id</text>
  </g>

  <g font-size="12">
    <text x="130" y="920" text-anchor="middle" fill="#9aa3b2">维护</text>
    <text x="130" y="938" text-anchor="middle" fill="#5b6778" font-size="11">upgrade / 启动</text>
  </g>
  <line x1="215" y1="926" x2="286" y2="926" stroke="#d9a13b" stroke-width="1.5" marker-end="url(#arrA)"/>
  <g filter="url(#shadow)">
    <rect x="292" y="896" width="250" height="52" rx="9" fill="#1c2230" stroke="#d9a13b"/>
    <text x="417" y="918" font-size="13" fill="#e6e9ef" text-anchor="middle" font-weight="600">comfyui_upgrade</text>
    <text x="417" y="936" font-size="11" fill="#9aa3b2" text-anchor="middle">git pull 核心 + 全部自定义节点</text>
  </g>
  <line x1="542" y1="922" x2="612" y2="922" stroke="#3fb27f" stroke-width="1.5" marker-end="url(#arrG)"/>
  <g filter="url(#shadow)">
    <rect x="618" y="896" width="264" height="52" rx="9" fill="#172823" stroke="#3fb27f"/>
    <text x="750" y="918" font-size="13" fill="#e6e9ef" text-anchor="middle" font-weight="600">ComfyUI 仓库</text>
    <text x="750" y="936" font-size="11" fill="#9aa3b2" text-anchor="middle">core + custom_nodes 更新</text>
  </g>

  <g font-size="12">
    <text x="130" y="960" text-anchor="middle" fill="#9b7ce8">可选 MCP</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="292" y="946" width="250" height="46" rx="9" fill="#1e1b2e" stroke="#9b7ce8"/>
    <text x="417" y="966" font-size="12.5" fill="#e6e9ef" text-anchor="middle" font-weight="600">ComfyUI MCP 服务器（comfy-cli）</text>
  </g>
  <line x1="542" y1="969" x2="612" y2="969" stroke="#9b7ce8" stroke-width="1.5" marker-end="url(#arr)"/>
  <g filter="url(#shadow)">
    <rect x="618" y="946" width="264" height="46" rx="9" fill="#1e1b2e" stroke="#9b7ce8"/>
    <text x="750" y="966" font-size="12.5" fill="#e6e9ef" text-anchor="middle" font-weight="600">模板 / 模型管理 / 云端模型</text>
  </g>

  <!-- 图例 -->
  <g font-size="11.5" fill="#9aa3b2">
    <rect x="30" y="100" width="12" height="12" rx="3" fill="#4f9cf9" opacity="0.7"/><text x="48" y="110">DSH / 插件 host 动作</text>
    <rect x="200" y="100" width="12" height="12" rx="3" fill="#3fb27f" opacity="0.7"/><text x="218" y="110">ComfyUI 桥接 / 服务</text>
    <rect x="400" y="100" width="12" height="12" rx="3" fill="#9b7ce8" opacity="0.7"/><text x="418" y="110">前端 / 可选 MCP</text>
    <rect x="560" y="100" width="12" height="12" rx="3" fill="#d9a13b" opacity="0.7"/><text x="578" y="110">host 特殊通道</text>
  </g>

</svg>
</body>
</html>
